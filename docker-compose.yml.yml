version: '3.8'

services:
  backend1:
    build: .
    environment:
      
      - ASPNETCORE_HTTP_PORTS=8080
      
      - ConnectionStrings__DefaultConnection=Host=host.docker.internal;Port=5432;Database=tsp_db;Username=postgres;Password=твій_пароль

  backend2:
    build: .
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=host.docker.internal;Port=5432;Database=tsp_db;Username=postgres;Password=1234

  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2