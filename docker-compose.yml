x-env: &env
  ASPNETCORE_HTTP_PORTS: "8080"
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=tsp_db;Username=postgres;Password=1234
  Cluster__Servers: "backend_1,backend_2"   
  Worker__MaxConcurrentTasks: "1"           
  Worker__SimulatedDelayMsPerGeneration: "30"  
  Worker__TaskTimeoutSeconds: "120"         

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tsp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tsp_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend_1:
    build: .
    image: tsp-backend
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      <<: *env
      ServerId: backend_1
    depends_on:
      db:
        condition: service_healthy

  backend_2:
    build: .
    image: tsp-backend
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      <<: *env
      ServerId: backend_2
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"   
      - "8443:443"    
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend_1
      - backend_2

volumes:
  db_data: